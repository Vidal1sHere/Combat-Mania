pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include 'jasper'
project(':jasper').projectDir = file('Jasper')

include 'strikeapi'
project(':strikeapi').projectDir = file('StrikeAPI')